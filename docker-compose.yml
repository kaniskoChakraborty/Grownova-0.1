version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grownova-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-grownova}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-grownova}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - grownova-network

  redis:
    image: redis:7-alpine
    container_name: grownova-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - grownova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  grownova-network:
    driver: bridge
